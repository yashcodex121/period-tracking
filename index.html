<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a8275f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Chakra – Period Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1f7;--card:#fff;--ink:#2a1830;--mute:#7b6a82;--line:#e6dcea;--acc:#a8275f;--accsoft:#f6d5e3;--fert:#1f8f84;--fertsoft:#cdeeea;--ov:#c98a00;--pred:#e9a9c3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1020;--card:#27182f;--ink:#f3e9f6;--mute:#a995b1;--line:#3b2848;--acc:#f06ea6;--accsoft:#4a1f37;--fert:#4fd1c5;--fertsoft:#16413d;--ov:#f2b632;--pred:#8a4a68}}
:root[data-theme="dark"]{--bg:#1a1020;--card:#27182f;--ink:#f3e9f6;--mute:#a995b1;--line:#3b2848;--acc:#f06ea6;--accsoft:#4a1f37;--fert:#4fd1c5;--fertsoft:#16413d;--ov:#f2b632;--pred:#8a4a68}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.45}
main{max-width:520px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:22px;margin:4px 0 14px;font-weight:700;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 10px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.mute{color:var(--mute);font-size:13px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--acc);color:#fff}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.sm{padding:6px 10px;font-size:13px;border-radius:8px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.day:focus-visible{outline:3px solid var(--fert);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{background:transparent;color:var(--mute);flex:1;max-width:100px;padding:8px 2px;font-size:12px;border-radius:10px}
nav button[aria-selected=true]{color:var(--acc);background:var(--accsoft)}
.ring{display:flex;flex-direction:column;align-items:center;padding:8px 0}
.ring svg{width:210px;height:210px}
.big{font-size:44px;font-weight:700;line-height:1}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--accsoft);color:var(--acc)}
.pill.f{background:var(--fertsoft);color:var(--fert)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:11px;color:var(--mute);text-align:center}
.day{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;position:relative;background:transparent;border:1px solid transparent;color:var(--ink);padding:0;font-weight:500}
.day.p{background:var(--acc);color:#fff}
.day.pr{background:var(--accsoft);border:1px dashed var(--pred)}
.day.fe{background:var(--fertsoft)}
.day.ov{background:var(--fertsoft);box-shadow:inset 0 0 0 2px var(--ov)}
.day.td{border-color:var(--ink)}
.day.dot::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--ov)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--ink);font-size:13px;font-weight:500}
.chip[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.rem{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rem:first-of-type{border-top:0}.rem div{flex:1}
.rem input[type=checkbox]{width:22px;height:22px;flex:none}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{display:block;font-size:26px}
#banner{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));max-width:496px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:14px;z-index:30;display:none}
#banner.on{display:block}
#banner .row{margin-top:10px}
#banner button{background:var(--acc);color:#fff}#banner button.ghost{color:var(--bg);border-color:var(--bg)}
.hide{display:none}
#lock{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;align-items:center;justify-content:center;padding:24px}
#lock.on{display:flex}
.notif-badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;margin-left:6px}
.notif-badge.on{background:var(--fertsoft);color:var(--fert)}
.notif-badge.off{background:var(--accsoft);color:var(--acc)}
.notif-badge.blocked{background:#fee2e2;color:#dc2626}
#install-bar{background:var(--accsoft);border:1px solid var(--acc);border-radius:14px;padding:12px 14px;margin-bottom:12px;display:none;align-items:center;gap:10px}
#install-bar.on{display:flex}
#install-bar p{margin:0;font-size:13px;color:var(--acc);font-weight:500;flex:1}
@media(prefers-reduced-motion:no-preference){#banner.on{animation:sh .5s 2}}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* ── AI Assistant ───────────────────────────────────────────────────── */
#ai-wrap{display:flex;flex-direction:column;height:calc(100vh - 130px);min-height:300px}
#ai-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 0 12px;scroll-behavior:smooth}
.msg{display:flex;gap:8px;align-items:flex-end;animation:msgIn .2s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse}
.msg-avatar{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--accsoft)}
.msg.user .msg-avatar{background:var(--acc);color:#fff}
.msg-bubble{max-width:82%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;word-break:break-word}
.msg.ai .msg-bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.user .msg-bubble{background:var(--acc);color:#fff;border-bottom-right-radius:4px}
.msg-bubble b{font-weight:600}
.msg-bubble ul{margin:6px 0;padding-left:18px}
.msg-bubble li{margin:2px 0}
.typing{display:flex;gap:4px;padding:4px 2px;align-items:center}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
#ai-form{display:flex;gap:8px;padding:10px 0 0;border-top:1px solid var(--line)}
#ai-input{flex:1;border-radius:22px;padding:10px 14px;resize:none;overflow:hidden;min-height:42px;max-height:110px;font-size:14px;line-height:1.4}
#ai-send{flex:none;width:42px;height:42px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;font-size:18px}
#ai-send:disabled{opacity:.4;cursor:not-allowed}
.ai-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.ai-chip{padding:6px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--acc);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.ai-chip:hover{background:var(--accsoft)}
.ai-key-bar{background:var(--accsoft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13px}
.ai-key-bar a{color:var(--acc);font-weight:600}
.ai-disclaimer{font-size:11px;color:var(--mute);text-align:center;padding:4px 0 0}
</style>
</head>
<body>

<!-- PIN Lock screen -->
<div id="lock">
  <div class="card" style="width:100%;max-width:320px;text-align:center">
    <h2>Chakra locked 🔒</h2>
    <input id="lp" type="password" inputmode="numeric" maxlength="8" placeholder="Enter PIN" style="text-align:center">
    <br><br>
    <button id="lb">Unlock</button>
    <p id="le" class="mute"></p>
  </div>
</div>

<!-- In-app alarm banner -->
<div id="banner" role="alert">
  <b id="bt"></b>
  <div id="bm" class="mute" style="color:inherit;opacity:.8"></div>
  <div class="row">
    <button id="snz">Snooze 10 min</button>
    <button class="ghost" id="bok">Dismiss</button>
  </div>
</div>

<main id="app"></main>
<nav id="nav" role="tablist"></nav>

<script>
const $=s=>document.querySelector(s);
const KEY='chakra.v1';
const DEF={periods:[],logs:{},settings:{cycle:28,plen:5,theme:'auto'},reminders:[
  {id:'r1',type:'period',label:'Period is coming soon',lead:2,time:'09:00',on:true},
  {id:'r2',type:'daily',label:'Take your pill / supplement',time:'21:00',on:false},
  {id:'r3',type:'daily',label:'Drink water',time:'14:00',on:false}
],fired:{}};

let S;
try{S=JSON.parse(localStorage.getItem(KEY))||structuredClone(DEF)}catch(e){S=structuredClone(DEF)}
S.fired=S.fired||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));syncSW()}catch(e){}};

// ── Dates ──────────────────────────────────────────────────────────────────
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const par=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const add=(s,n)=>{const d=par(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((par(a)-par(b))/864e5);
const today=()=>iso(new Date());
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmt=s=>{const d=par(s);return d.getDate()+' '+MON[d.getMonth()].slice(0,3)};

// ── Prediction engine ──────────────────────────────────────────────────────
function sorted(){return[...S.periods].sort((a,b)=>a.start<b.start?-1:1)}
function cycles(){const p=sorted(),o=[];for(let i=1;i<p.length;i++){const d=diff(p[i].start,p[i-1].start);if(d>=15&&d<=60)o.push(d)}return o}
function avg(a,f){return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):f}
function stats(){
  const c=cycles().slice(-6);
  const cyc=avg(c,+S.settings.cycle);
  const lens=sorted().filter(p=>p.end).map(p=>diff(p.end,p.start)+1).filter(n=>n>0&&n<15).slice(-6);
  const plen=avg(lens,+S.settings.plen);
  const sd=c.length>1?Math.sqrt(c.reduce((s,x)=>s+(x-cyc)**2,0)/c.length):null;
  return{cyc,plen,sd,c,n:sorted().length}}
function forecast(n=4){
  const p=sorted();if(!p.length)return[];
  const st=stats(),out=[];let s=p[p.length-1].start;
  for(let i=0;i<n;i++){s=add(s,st.cyc);const ov=add(s,-14);out.push({start:s,end:add(s,st.plen-1),ov,fs:add(ov,-5),fe:add(ov,1)})}
  return out}
function dayType(d){
  const t={};
  for(const p of S.periods){const e=p.end||(diff(today(),p.start)<10&&diff(today(),p.start)>=0?today():p.start);if(d>=p.start&&d<=e)t.p=1}
  for(const f of forecast(6)){if(d>=f.start&&d<=f.end)t.pr=1;if(d>=f.fs&&d<=f.fe)t.fe=1;if(d===f.ov)t.ov=1}
  return t}
function status(){
  const p=sorted();if(!p.length)return null;
  const last=p[p.length-1],t=today(),st=stats();
  const day=diff(t,last.start)+1;
  const next=add(last.start,st.cyc),left=diff(next,t);
  const ov=add(next,-14);
  const open=!last.end&&day<=12;
  let phase='Follicular phase',cls='';
  if(open||(day<=st.plen&&last.end&&t<=last.end)){phase='Period in progress'}
  else if(t>=add(ov,-5)&&t<=add(ov,1)){phase=t===ov?'Ovulation day':'Fertile window';cls='f'}
  else if(t>ov){phase='Luteal phase'}
  else phase='Follicular phase';
  return{last,day,next,left,ov,phase,cls,open}}

// ── Service Worker + Background Notifications ──────────────────────────────
let swReg=null;

async function registerSW(){
  if(!('serviceWorker'in navigator))return;
  try{
    swReg=await navigator.serviceWorker.register('sw.js');
    // Register periodic background sync (Chrome Android / Edge)
    if('periodicSync'in swReg){
      try{
        const status=await navigator.permissions.query({name:'periodic-background-sync'});
        if(status.state==='granted'){
          await swReg.periodicSync.register('chakra-check',{minInterval:60*60*1000}); // every hour
        }
      }catch(e){/* not supported on this browser */}
    }
    syncSW();
  }catch(e){}
}

// Push reminders + predictions to SW so it can fire notifications when closed
function syncSW(){
  if(!swReg||!swReg.active)return;
  const fc=forecast(2);
  const predictions={
    nextPeriod:fc[0]?fc[0].start:null,
    fertileStart:fc[0]?fc[0].fs:null,
    ovulation:fc[0]?fc[0].ov:null
  };
  swReg.active.postMessage({
    type:'SCHEDULE',
    reminders:S.reminders,
    predictions
  });
}

// Wait for SW to become active then sync
navigator.serviceWorker&&navigator.serviceWorker.ready.then(reg=>{
  swReg=reg;
  syncSW();
});

registerSW();

// ── UI ─────────────────────────────────────────────────────────────────────
let tab='today',cm=new Date(),sel=null;

// Handle URL params for shortcuts (manifest shortcuts deeplink)
(()=>{
  const p=new URLSearchParams(location.search);
  const t=p.get('tab');
  if(t)tab=t;
})();

const TABS=[['today','Today'],['cal','Calendar'],['rem','Alerts'],['stats','Stats'],['ai','AI'],['set','Settings']];

function nav(){
  $('#nav').innerHTML=TABS.map(([k,v])=>`<button role="tab" aria-selected="${tab===k}" data-t="${k}">${v}</button>`).join('');
  $('#nav').onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;sel=null;render()}}}

function render(){nav();applyTheme();const f={today:vToday,cal:vCal,rem:vRem,stats:vStats,ai:vAI,set:vSet}[tab];$('#app').innerHTML=f();bind();
  // Handle logtoday shortcut from URL
  const p=new URLSearchParams(location.search);
  if(p.get('action')==='logtoday'&&tab==='cal'){sel=today();history.replaceState({},'','./index.html');$('#app').innerHTML=vCal();bind()}}

function applyTheme(){const t=S.settings.theme;if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}

// ── Views ──────────────────────────────────────────────────────────────────
function vToday(){
  if(S.settings.preg&&S.settings.preg.on)return vPreg();
  const s=status(),st=stats();
  if(!s)return`<h1>Chakra</h1>
  ${installBar()}
  <div class="card"><h2>Let's get started</h2><p class="mute">Enter your last period's start date. The more cycles you log, the more accurate predictions become.</p><label>Period start date</label><input type="date" id="fs" max="${today()}" value="${today()}"><br><br><button data-a="addstart">Save</button></div>`;
  const pct=Math.min(1,s.day/st.cyc),C=2*Math.PI*86;
  const msg=s.left>0?`Next period in ${s.left} day${s.left===1?'':'s'} (${fmt(s.next)})`:s.left===0?'Period expected today':`Period is ${-s.left} day${-s.left===1?'':'s'} late`;
  return`<h1>Hello 👋</h1>
  ${installBar()}
  <div class="card ring"><svg viewBox="0 0 200 200" role="img" aria-label="Cycle day ${s.day}">
    <circle cx="100" cy="100" r="86" fill="none" stroke="var(--line)" stroke-width="12"/>
    <circle cx="100" cy="100" r="86" fill="none" stroke="var(--acc)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}" transform="rotate(-90 100 100)"/>
    <text x="100" y="98" text-anchor="middle" font-size="13" fill="var(--mute)" font-family="inherit">Cycle day</text>
    <text x="100" y="136" text-anchor="middle" font-size="46" font-weight="700" fill="var(--ink)" font-family="inherit">${s.day}</text>
  </svg>
  <span class="pill ${s.cls}">${s.phase}</span>
  <p style="margin:10px 0 0;font-weight:600">${msg}</p>
  <p class="mute" style="margin:2px 0 0">Ovulation: ${fmt(s.ov)} · Fertile: ${fmt(add(s.ov,-5))}–${fmt(add(s.ov,1))}</p></div>
  <div class="row" style="margin-bottom:12px">
    ${s.open?`<button data-a="end">Period ended</button>`:`<button data-a="start">Period started</button>`}
    <button class="ghost" data-a="logtoday">Log today</button>
  </div>
  ${s.left<0&&s.left>-45?`<p class="mute">Your cycle may be late due to stress, sleep, or health changes. If this happens often or you've missed 3+ months, speak to a doctor.</p>`:''}
  ${insights()}
  <div class="card"><h2>How are you feeling today?</h2>${logForm(today())}</div>`}

const SYM=['Cramps','Headache','Fatigue','Bloating','Pimples','Back pain','Nausea','Cravings'];
const MOOD=['😊 Happy','😐 Neutral','😢 Sad','😠 Irritable','😰 Anxious'];
const FLOW=['Light','Medium','Heavy'];

function logForm(d){
  const l=S.logs[d]||{};
  return`<div data-d="${d}">
  <label>Flow</label><div class="chips">${FLOW.map(x=>`<button class="chip" aria-pressed="${l.flow===x}" data-f="${x}">${x}</button>`).join('')}</div>
  <label>Mood</label><div class="chips">${MOOD.map(x=>`<button class="chip" aria-pressed="${l.mood===x}" data-m="${x}">${x}</button>`).join('')}</div>
  <label>Symptoms</label><div class="chips">${SYM.map(x=>`<button class="chip" aria-pressed="${(l.sym||[]).includes(x)}" data-s="${x}">${x}</button>`).join('')}</div>
  <label>Morning temperature °C (BBT)</label><input type="number" step="0.01" min="34" max="39" data-b value="${l.bbt||''}" placeholder="36.45">
  <label>Note</label><textarea rows="2" data-n placeholder="Anything to note...">${l.note||''}</textarea>
  </div>`}

function vCal(){
  const y=cm.getFullYear(),m=cm.getMonth(),first=new Date(y,m,1),n=new Date(y,m+1,0).getDate();
  let h=`<h1>Calendar</h1><div class="card">
  <div class="row" style="margin-bottom:10px">
    <button class="ghost sm" data-a="prev" aria-label="Previous month">‹</button>
    <b style="text-align:center">${MON[m]} ${y}</b>
    <button class="ghost sm" data-a="next" aria-label="Next month">›</button>
  </div><div class="cal">`;
  h+=['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<first.getDay();i++)h+='<div></div>';
  for(let d=1;d<=n;d++){
    const s=`${y}-${pad(m+1)}-${pad(d)}`,t=dayType(s);
    const c=['day',t.p&&'p',!t.p&&t.pr&&'pr',!t.p&&t.ov&&'ov',!t.p&&!t.ov&&t.fe&&'fe',s===today()&&'td',S.logs[s]&&'dot'].filter(Boolean).join(' ');
    h+=`<button class="${c}" data-day="${s}" aria-label="${s}">${d}</button>`}
  h+=`</div>
  <div class="legend">
    <span><i style="background:var(--acc)"></i>Period</span>
    <span><i style="background:var(--accsoft);border:1px dashed var(--pred)"></i>Predicted</span>
    <span><i style="background:var(--fertsoft)"></i>Fertile</span>
    <span><i style="box-shadow:inset 0 0 0 2px var(--ov)"></i>Ovulation</span>
  </div></div>`;
  if(sel)h+=`<div class="card"><h2>${fmt(sel)}</h2>${logForm(sel)}<div class="row" style="margin-top:12px"><button class="ghost" data-a="togglep">${dayType(sel).p?'Remove from period':'Mark as period'}</button></div></div>`;
  return h}

function vRem(){
  const perm='Notification'in window?Notification.permission:'unsupported';
  const permLabel=perm==='granted'?'<span class="notif-badge on">Enabled ✓</span>':perm==='denied'?'<span class="notif-badge blocked">Blocked in browser</span>':perm==='unsupported'?'<span class="notif-badge off">Not supported</span>':'<span class="notif-badge off">Not enabled</span>';
  const remList=S.reminders.map(r=>`
    <div class="rem">
      <input type="checkbox" data-rid="${r.id}" ${r.on?'checked':''} aria-label="${r.label}">
      <div>
        <b>${r.label}</b>

let AC,cur=null,beepT;
function beep(){
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;
  for(let i=0;i<6;i++){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=i%2?660:880;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.start(t);o.stop(t+.4);t+=.45}}catch(e){}}

function askPerm(manual){
  if(!('Notification'in window)){if(manual)alert('This browser does not support notifications; the in-app alarm will still work.');return}
  if(Notification.permission==='default')Notification.requestPermission().then(p=>{if(tab==='rem')render();syncSW()})
  else if(manual&&Notification.permission==='granted'){ring('Notifications enabled ✓','You will receive reminders even when the app is closed.','perm-test')}}

function ring(title,msg,id){
  cur={title,msg,id};$('#bt').textContent=title;$('#bm').textContent=msg;$('#banner').classList.add('on');
  beep();clearInterval(beepT);beepT=setInterval(beep,5000);
  try{if(Notification.permission==='granted')new Notification(title,{body:msg,icon:'./icon-192.png',tag:id})}catch(e){}
  if(navigator.vibrate)navigator.vibrate([300,150,300])}

function stopRing(){clearInterval(beepT);$('#banner').classList.remove('on')}
$('#bok').onclick=stopRing;
$('#snz').onclick=()=>{stopRing();const c=cur;setTimeout(()=>ring(c.title,c.msg,c.id),10*60*1000)};

    if(r.type==='daily'){if(S.fired[r.id]!==t){S.fired[r.id]=t;save();ring(r.label,'Reminder 🔔',r.id)}}
    else if(r.type==='fert'){if(st&&!(S.settings.preg&&S.settings.preg.on)&&diff(add(st.ov,-5),t)===+r.lead&&S.fired[r.id]!==t){S.fired[r.id]=t;save();ring(r.label,'Your fertile window is coming up',r.id)}}
    else if(st&&!(S.settings.preg&&S.settings.preg.on)&&st.left===+r.lead){const k=t+st.next;if(S.fired[r.id]!==k){S.fired[r.id]=k;save();ring(r.label,r.lead?`Period expected in ${r.lead} day${r.lead===1?'':'s'} (${fmt(st.next)})`:'Period expected today',r.id)}}}}

async function callGroq(userMsg) {
  const apiKey = S.settings.groqKey||'';
  if (!apiKey) return null; // no key → use fallback

  const messages = [
    {role:'system', content: buildAIContext()},
    ...aiHistory.map(m=>({role: m.role==='model'?'assistant':m.role, content: m.text})),
    {role:'user', content: userMsg}
  ];

  const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method:'POST',
    headers:{'Content-Type':'application/json', 'Authorization':`Bearer ${apiKey}`},
    body: JSON.stringify({
      model: 'llama-3.3-70b-versatile',
      messages,
      temperature: 0.7,
      max_tokens: 600
    })
  });

  if (!res.ok) {
    const err = await res.json().catch(()=>({}));
    const msg = err?.error?.message || `HTTP ${res.status}`;
    throw new Error(msg);
  }
  const data = await res.json();
  return data?.choices?.[0]?.message?.content || 'Sorry, I could not generate a response.';
}

function fallbackAnswer(q) {
  q = q.toLowerCase();
  if (/cramp|pain|hurt/.test(q)) return `**Period cramps** happen when your uterus contracts to shed its lining.\n\n**Natural relief tips:**\n- Apply a heating pad to your lower abdomen\n- Light exercise like walking or yoga can help\n- Anti-inflammatory foods: ginger tea, turmeric, omega-3s\n- Magnesium-rich foods: nuts, seeds, dark chocolate\n- Stay hydrated and reduce caffeine\n\nIf cramps are severe enough to disrupt daily life, please see a doctor — it could be endometriosis or fibroids.`;
  if (/pms|mood|irritab|sad|anxious|luteal/.test(q)) return `**PMS (Premenstrual Syndrome)** typically occurs in the luteal phase (days after ovulation).\n\n**What helps:**\n- Reduce salt, caffeine, and alcohol\n- Eat complex carbs: oats, sweet potato, banana\n- Regular aerobic exercise\n- Prioritise 7–9 hours of sleep\n- Magnesium and B6 supplements may help (ask your doctor)\n\nIf PMS severely affects your life, it could be PMDD — worth discussing with a doctor.`;
  if (/fertil|ovulat|conceive|pregnant/.test(q)) return `**The fertile window** is the ~6 days leading up to and including ovulation.\n\n- Ovulation typically occurs ~14 days before your next period\n- Your Chakra app predicts this based on your logged cycles\n- Signs of ovulation: clear egg-white cervical mucus, slight temperature rise (BBT), mild pelvic pain (mittelschmerz)\n- Sperm can survive 3–5 days inside the body\n\nFor conception, timing intercourse in this window maximises chances.`;
  if (/irregu|miss|late|skip/.test(q)) return `**Irregular cycles** can be caused by many factors:\n\n- **Stress** — cortisol disrupts hormone signals\n- **Weight changes** — under or overweight affects estrogen\n- **Sleep disruption** — shift work, poor sleep\n- **Thyroid issues** — hypo/hyperthyroidism\n- **PCOS** — polycystic ovary syndrome\n- **Perimenopause** — if you're in your 40s\n\nOccasional variation (±7 days) is normal. If you consistently miss periods or they're very irregular, see a doctor.`;
  if (/stress/.test(q)) return `**Stress and your cycle** are closely linked through the HPA (hypothalamic-pituitary-adrenal) axis.\n\n- High cortisol can delay or suppress ovulation\n- This can make your cycle longer or cause a missed period\n- Chronic stress may worsen PMS symptoms\n\n**What helps:** regular exercise, meditation, adequate sleep, limiting caffeine, and talking to someone you trust.`;
  if (/tire|fatigue|energy|exhaust/.test(q)) return `**Fatigue during your period** is very common. Causes include:\n\n- **Iron loss** from bleeding — especially with heavy flow\n- **Prostaglandins** (the chemicals causing cramps) cause fatigue\n- **Hormonal drop** in estrogen and progesterone\n\n**What helps:**\n- Iron-rich foods: spinach, lentils, red meat, pumpkin seeds\n- Pair iron with vitamin C for better absorption\n- Stay hydrated\n- Rest when you need to — it's okay\n\nIf fatigue is severe, ask your doctor to check for anaemia.`;
  if (/flow|heavy|light|bleed/.test(q)) return `**Normal period flow** varies person to person.\n\n- **Light:** needing fewer than 3 pads/tampons per day\n- **Medium:** 3–6 pads/tampons per day\n- **Heavy:** soaking a pad/tampon every 1–2 hours\n\nHeavy flow (menorrhagia) can cause anaemia over time. If you're consistently soaking through protection hourly or passing large clots, see a doctor.`;
  if (/bbt|temperature|basal/.test(q)) return `**BBT (Basal Body Temperature)** charting tracks your resting temperature to detect ovulation.\n\n- Take your temperature every morning before getting up\n- After ovulation, progesterone causes a rise of **0.2–0.5°C**\n- Log it in Chakra — the app will detect the shift automatically\n- A sustained rise for 3+ days confirms ovulation occurred\n\nBBT confirms ovulation happened but doesn't predict it in advance — pair it with cervical mucus observation for best results.`;
  if (/discharge|mucus|cervical/.test(q)) return `**Cervical mucus** changes throughout your cycle:\n\n- **After period:** dry or sticky\n- **Approaching ovulation:** creamy, then wet and slippery\n- **Peak fertility:** clear, stretchy, egg-white consistency\n- **After ovulation:** dries up, becomes thick/cloudy\n\nEgg-white mucus is your body's natural fertility signal. Any unusual colour (yellow/green), smell, or persistent itching could indicate infection — see a doctor.`;
  if (/diet|food|eat|nutrition/.test(q)) return `**Eating for your cycle:**\n\n**Period phase:** iron (spinach, lentils), magnesium (dark chocolate, nuts), anti-inflammatories (ginger, turmeric)\n**Follicular phase:** light proteins, fermented foods, leafy greens\n**Ovulation:** antioxidants (berries, colourful veg), zinc (pumpkin seeds, shellfish)\n**Luteal phase:** complex carbs (oats, sweet potato), B6 (bananas, chickpeas), calcium (dairy, broccoli) to reduce PMS`;
  if (/sleep|insomnia|rest/.test(q)) return `**Sleep and your cycle** are deeply connected.\n\n- **Follicular phase:** rising estrogen improves sleep quality\n- **Luteal phase:** progesterone can cause sleepiness but disrupts deep sleep\n- **Before period:** body temperature rises slightly, which can cause restlessness\n\n**Tips:** keep a cool room, limit screens before bed, avoid caffeine after 2pm, and try to sleep and wake at consistent times.`;
  if (/exercise|workout|sport|gym/.test(q)) return `**Exercise across your cycle:**\n\n- **Period:** gentle movement — walking, yoga, swimming — can reduce cramps\n- **Follicular (days 1–13):** energy rises, great for strength training and HIIT\n- **Ovulation:** peak energy and pain tolerance — ideal for personal bests\n- **Luteal (days 15–28):** energy dips, favour steady-state cardio and lighter weights\n\nListening to your body is always the right answer.`;

  const s = status(), st = stats();
  return `I'm here to help with any health questions related to your cycle, symptoms, nutrition, mood, or general wellbeing.\n\n**Your cycle right now:**\n- Day ${s?s.day:'?'} of your cycle\n- Phase: ${s?s.phase:'not enough data'}\n- ${st.n} period${st.n===1?'':'s'} logged\n\nTry asking me something specific — like "why do I feel tired on my period?" or "what foods help with cramps?"`;
}

function mdToHtml(text) {
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/^- (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>.*<\/li>)/gs,m=>`<ul>${m}</ul>`)
    .replace(/\n{2,}/g,'</p><p>')
    .replace(/\n/g,'<br>')
    .replace(/^/,'<p>').replace(/$/,'</p>');
}

function appendMsg(role, text, isTyping=false) {
  const wrap = $('#ai-msgs');
  if (!wrap) return;
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = isTyping
    ? `<div class="msg-avatar">${role==='ai'?'🌸':'👤'}</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>`
    : `<div class="msg-avatar">${role==='ai'?'🌸':'👤'}</div><div class="msg-bubble">${role==='ai'?mdToHtml(text):text.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>`;
  if (isTyping) div.id = 'ai-typing';
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
  return div;
}

async function sendAIMessage(userText) {
  userText = userText.trim();
  if (!userText) return;

  const input = $('#ai-input'), btn = $('#ai-send');
  if (input) input.value = '';
  if (btn) btn.disabled = true;
  if (input) input.style.height = '';

  appendMsg('user', userText);
  aiHistory.push({role:'user', text:userText});

  const typing = appendMsg('ai', '', true);

  let reply;
  try {
    const groq = await callGroq(userText);
    reply = groq !== null ? groq : fallbackAnswer(userText);
  } catch(e) {
    const errMsg = e.message||'';
    if (errMsg.includes('401')||errMsg.includes('invalid_api_key')||errMsg.includes('Invalid API Key')) {
      reply = '⚠️ Your Groq API key looks invalid. Please check it in **Settings → AI Assistant**.\n\nUsing built-in knowledge for now:\n\n' + fallbackAnswer(userText);
    } else if (errMsg.includes('429')||errMsg.includes('rate_limit')||errMsg.includes('quota')) {
      reply = '⚠️ Groq API rate limit reached. Using built-in knowledge:\n\n' + fallbackAnswer(userText);
    } else {
      reply = fallbackAnswer(userText);
    }
  }

  aiHistory.push({role:'model', text:reply});
  if (typing) typing.remove();
  appendMsg('ai', reply);
  if (btn) btn.disabled = false;
  const wrap = $('#ai-msgs');
  if (wrap) wrap.scrollTop = wrap.scrollHeight;
}

function vAI() {
  const hasKey = !!(S.settings.groqKey);
  const keyBar = hasKey ? '' : `<div class="ai-key-bar">
    💡 Add a free <a href="https://console.groq.com/keys" target="_blank" rel="noopener">Groq API key</a> in <b>Settings → AI Assistant</b> for smarter answers. Works without it too!
  </div>`;

  const suggested = AI_SUGGESTED.slice(0,6).map(q=>

  const msgs = aiHistory.length === 0
    ? `<div class="msg ai">

        <div class="msg-bubble">Hi! I'm <b>Chakra AI</b>, your personal health assistant. 👋<br><br>

function loadDemo(){
  const t=today(),cy=[29,28,30,27,28,29];let st=add(t,-9);const starts=[st];
  for(const c of cy){st=add(st,-c);starts.unshift(st)}
  S.periods=starts.map(x=>({start:x,end:add(x,4)}));S.logs={};
  S.periods.forEach((p,i)=>{for(let d=0;d<5;d++){const k=add(p.start,d);S.logs[k]={flow:['Heavy','Heavy','Medium','Light','Light'][d],mood:['😢 Sad','😐 Neutral','😊 Happy'][(i+d)%3],sym:d<2?['Cramps','Fatigue']:d<3?['Back pain']:[]}}});
  for(let i=24;i>=0;i--){const k=add(t,-i),p=[...S.periods].reverse().find(x=>x.start<=k),cd=diff(k,p.start)+1;S.logs[k]=Object.assign(S.logs[k]||{},{bbt:+(36.25+(cd>=15?.32:0)+Math.sin(i*2.1)*.05).toFixed(2)})}
  S.settings.preg={on:false};save()}
if(location.hash==='#demo'&&!S.periods.length)loadDemo();

// ── BBT card ───────────────────────────────────────────────────────────────
function bbtCard(){
  const p=Object.entries(S.logs).filter(([k,l])=>l.bbt).sort().slice(-30);
  const h='<div class="card"><h2>Temperature (BBT)</h2>';
  if(p.length<2)return h+'<p class="mute">Log your temperature each morning before getting up. After ovulation it typically rises by 0.2–0.5°C.</p></div>';
  const v=p.map(x=>x[1].bbt),mn=Math.min(...v)-.1,mx=Math.max(...v)+.1;
  const pts=v.map((y,i)=>`${10+i*300/(v.length-1)},${110-(y-mn)/(mx-mn)*100}`).join(' ');
  let n='';
  if(v.length>=9){const b=v.slice(-9,-3).reduce((a,c)=>a+c,0)/6;if(v.slice(-3).every(x=>x>=b+.2))n='<p class="pill f">Temperature shift detected — ovulation may have occurred</p>'}
  return h+`<svg viewBox="0 0 320 120" style="width:100%;height:130px" role="img" aria-label="BBT chart"><polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>${v.map((y,i)=>`<circle cx="${10+i*300/(v.length-1)}" cy="${110-(y-mn)/(mx-mn)*100}" r="3" fill="var(--acc)"/>`).join('')}</svg><p class="mute">${v.length} readings · ${Math.min(...v)}–${Math.max(...v)}°C</p>${n}</div>`}

function reportHTML(){
  const st=stats(),P=sorted(),sym={};Object.values(S.logs).forEach(l=>(l.sym||[]).forEach(k=>sym[k]=(sym[k]||0)+1));
  const rows=P.map((p,i)=>`<tr><td>${p.start}</td><td>${p.end||'–'}</td><td>${p.end?diff(p.end,p.start)+1:'–'}</td><td>${i?diff(p.start,P[i-1].start):'–'}</td></tr>`).join('');
  const bb=Object.entries(S.logs).filter(([k,l])=>l.bbt).sort().slice(-14).map(([k,l])=>`<tr><td>${k}</td><td>${l.bbt}</td></tr>`).join('');

  <p><b>Avg cycle:</b> ${st.cyc} days · <b>Avg period:</b> ${st.plen} days · <b>Cycles logged:</b> ${P.length}${st.sd!=null?` · <b>Variation (SD):</b> ${st.sd.toFixed(1)} days`:''}</p>
  <h2>Periods</h2><table><tr><th>Start</th><th>End</th><th>Length (days)</th><th>Cycle length (days)</th></tr>${rows}</table>

  ${bb?`<h2>BBT (last 14 readings, °C)</h2><table><tr><th>Date</th><th>Temp</th></tr>${bb}</table>`:''}

// ── PIN lock ───────────────────────────────────────────────────────────────
async function hash(p,s){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));
  return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

if(S.settings.pin)$('#lock').classList.add('on');
$('#lb').onclick=async()=>{
  const p=S.settings.pin;
  if(await hash($('#lp').value,p.salt)===p.h){$('#lock').classList.remove('on');$('#lp').value='';$('#le').textContent=''}
  else $('#le').textContent='Incorrect PIN'};
$('#lp').onkeydown=e=>{if(e.key==='Enter')$('#lb').click()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.settings.pin)$('#lock').classList.add('on')});

const cap=async n=>{try{return await window.claude.use(n)}catch(e){return null}};
async function saveFile(name,data,type){
  const d=await cap('downloads');
  if(!d){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:type||'application/json'}));a.download=name;a.click();return}
  try{await d.save({filename:name,data:new Blob([data],{type:type||'application/json'})})}catch(e){}}
